<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PIVOT COMMAND</title>
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://s3.tradingview.com/tv.js" defer></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <h1>PIVOT COMMAND</h1>
        </div>

        <form id="chartForm" class="controls" autocomplete="off">
          <section class="symbol-field" aria-label="선택된 심볼">
            <div class="symbol-field-head">
              <span class="field-label">심볼</span>
            </div>
            <div class="symbol-select-row">
              <select id="symbolSelect" aria-label="심볼 선택"></select>
              <div class="symbol-tools" aria-label="심볼 검색">
                <button id="openSearchButton" class="icon-only" type="button" title="심볼 검색">
                  <i data-lucide="search"></i>
                </button>
              </div>
            </div>
            <input id="symbolInput" type="hidden" value="GATEIO:ETHUSDT.P, BYBIT:ETHUSDT.P" />
          </section>

          <label>
            <span>봉</span>
            <select id="intervalSelect">
              <option value="1">1m</option>
              <option value="5">5m</option>
              <option value="15">15m</option>
              <option value="60" selected>1h</option>
              <option value="240">4h</option>
              <option value="D">1D</option>
            </select>
          </label>

          <label>
            <span>배치</span>
            <select id="layoutSelect">
              <option value="auto" selected>Auto</option>
              <option value="1">1</option>
              <option value="2">2</option>
              <option value="4">4</option>
              <option value="6">6</option>
              <option value="9">9</option>
            </select>
          </label>

          <section class="indicator-field" aria-label="차트 지표">
            <span class="field-label">지표</span>
            <button id="openIndicatorButton" class="icon-button" type="button" title="지표 선택">
              <i data-lucide="sliders-horizontal"></i>
              <span id="indicatorSummary">지표</span>
            </button>
          </section>
        </form>
      </header>

      <section id="symbolSearchPanel" class="search-panel" aria-label="심볼 검색" hidden>
        <div class="search-card">
          <div class="search-head">
            <div>
              <h2>심볼 검색</h2>
              <p>TradingView 심볼 형식으로 차트와 피드를 같이 추가합니다</p>
            </div>
            <button id="closeSearchButton" class="icon-only" type="button" title="닫기">
              <i data-lucide="x"></i>
            </button>
          </div>

          <label class="search-input-wrap">
            <i data-lucide="search"></i>
            <input id="symbolSearchInput" type="search" placeholder="ETH, BTC, SOL..." spellcheck="false" />
          </label>

          <div class="exchange-filter" aria-label="거래소 필터">
            <button type="button" class="active" data-exchange="ALL">전체</button>
            <button type="button" data-exchange="GATEIO">Gate.io</button>
            <button type="button" data-exchange="BYBIT">Bybit</button>
            <button type="button" data-exchange="BINANCE">Binance</button>
          </div>

          <div id="symbolResults" class="symbol-results"></div>
        </div>
      </section>

      <section id="indicatorPanel" class="search-panel" aria-label="지표 선택" hidden>
        <div class="search-card indicator-card">
          <div class="search-head">
            <div>
              <h2>지표</h2>
              <p>선택한 지표는 모든 차트에 같이 적용됩니다</p>
            </div>
            <button id="closeIndicatorButton" class="icon-only" type="button" title="닫기">
              <i data-lucide="x"></i>
            </button>
          </div>

          <div id="indicatorOptions" class="indicator-options"></div>
        </div>
      </section>

      <section class="workspace">
        <section id="chartGrid" class="chart-grid" aria-label="멀티 차트"></section>

        <aside class="monitor" aria-label="피봇 모니터">
          <div class="monitor-head">
            <div>
              <h2>피봇 모니터</h2>
              <p id="feedStatus">연결 준비</p>
            </div>
            <label class="switch">
              <input id="liveToggle" type="checkbox" checked />
              <span></span>
            </label>
          </div>

          <div class="profile-row">
            <button id="saveProfileButton" class="icon-button" type="button" title="프로필 저장">
              <i data-lucide="save"></i>
              <span>저장</span>
            </button>
            <button id="resetButton" class="icon-button" type="button" title="기본값">
              <i data-lucide="rotate-ccw"></i>
              <span>기본</span>
            </button>
          </div>

          <div id="tickerList" class="ticker-list"></div>
        </aside>
      </section>
    </main>
  </body>
</html>
