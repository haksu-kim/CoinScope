<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Coin Scope</title>
    <link rel="stylesheet" href="./styles.css?v=20260805-1" />
    <script src="https://s3.tradingview.com/tv.js" defer></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js" defer></script>
    <script src="./config.js?v=20260805-1" defer></script>
    <script src="./symbols-cache.js?v=20260805-1" defer></script>
    <script src="./app.js?v=20260805-1" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div class="brand">
          <h1>Coin Scope</h1>
        </div>

        <form id="chartForm" class="controls" autocomplete="off">
          <section class="chart-manager-field" aria-label="차트 관리">
            <span class="field-label">차트</span>
            <button id="openSearchButton" class="icon-button chart-manager-button" type="button" title="차트 관리">
              <i data-lucide="panel-right-open"></i>
              <span id="chartSummary">차트 3 / 9</span>
            </button>
            <select id="symbolSelect" aria-label="심볼 선택" hidden></select>
            <input id="symbolInput" type="hidden" value="BINANCE:BTCUSDT.P, BINANCE:ETHUSDT.P, OANDA:NAS100USD" />
          </section>

          <label>
            <span>봉</span>
            <select id="intervalSelect">
              <option value="1">1m</option>
              <option value="5">5m</option>
              <option value="15">15m</option>
              <option value="60" selected>1h</option>
              <option value="240">4h</option>
              <option value="D">1D</option>
            </select>
          </label>

          <section class="indicator-field" aria-label="차트 지표">
            <span class="field-label">지표</span>
            <button id="openIndicatorButton" class="icon-button" type="button" title="지표 선택">
              <i data-lucide="sliders-horizontal"></i>
              <span id="indicatorSummary">지표</span>
            </button>
          </section>

          <section class="horizontal-field" aria-label="가로 정렬">
            <span class="field-label">가로</span>
            <label class="compact-switch" title="가로 정렬">
              <input id="horizontalToggle" type="checkbox" />
              <span></span>
            </label>
          </section>
        </form>
      </header>

      <section id="symbolSearchPanel" class="search-panel manager-panel" aria-label="차트 관리" hidden>
        <div class="search-card manager-drawer">
          <div class="search-head">
            <div>
              <h2>차트 관리</h2>
              <p id="chartCountText">3 / 9</p>
            </div>
            <button id="closeSearchButton" class="icon-only" type="button" title="닫기">
              <i data-lucide="x"></i>
            </button>
          </div>

          <div class="chart-manager-actions">
            <button id="addChartButton" class="icon-button primary" type="button" title="차트 추가">
              <i data-lucide="plus"></i>
              <span>차트 추가</span>
            </button>
          </div>

          <div id="chartManagerList" class="chart-manager-list"></div>
        </div>
      </section>

      <section id="indicatorPanel" class="search-panel" aria-label="지표 선택" hidden>
        <div class="search-card indicator-card">
          <div class="search-head">
            <div>
              <h2>지표</h2>
              <p>선택한 지표는 모든 차트에 같이 적용됩니다</p>
            </div>
            <button id="closeIndicatorButton" class="icon-only" type="button" title="닫기">
              <i data-lucide="x"></i>
            </button>
          </div>

          <div id="indicatorOptions" class="indicator-options"></div>
        </div>
      </section>

      <section class="workspace">
        <section id="chartGrid" class="chart-grid" aria-label="멀티 차트"></section>
      </section>
    </main>
  </body>
</html>
